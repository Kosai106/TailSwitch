name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package
    runs-on: ubuntu-latest
    # Match the documented development container so the shipped binary links
    # against Qt/KF6 versions no newer than SteamOS provides.
    container: ubuntu:26.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config dbus-daemon binutils \
            qt6-base-dev qt6-base-dev-tools qt6-svg-plugins libkf6statusnotifieritem-dev \
            extra-cmake-modules ca-certificates
      - uses: actions/checkout@v4
      - name: Build release archive
        run: ./packaging/make-release.sh
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^project(TailSwitch VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          test "$tag" = "$version" || { echo "Tag v$tag does not match CMake version $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tailswitch-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tailswitch-linux-x86_64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
